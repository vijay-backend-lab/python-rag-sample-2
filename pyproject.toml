[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-query-api"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "mangum>=0.19,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
    "python-dotenv", "pypdf>=5,<6", "python-multipart>=0.0.9,<0.1"]

[tool.setuptools]
py-modules = ["main", "lambda_function", "ingestion", "ingestion_lambda"]


